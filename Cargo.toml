[package]
name = "backup-system"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
dotenvy = "0.15"
humansize = "2"
ignore = "0.4"
ratatui = "0.29"
reqwest = { version = "0.11", default-features = false, features = ["rustls-tls"] }
rust-s3 = { version = "0.35", default-features = false, features = ["tokio-rustls-tls", "http-credentials"] }
tokio = { version = "1", features = ["full"] }
walkdir = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
