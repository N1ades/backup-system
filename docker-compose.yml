services:
  backup-system:
    build: .
    container_name: backup-system
    env_file: .env
    volumes:
      - /srv:/srv/srv1:ro
      - ./restore:/restore
      # Add this line below:
      - ./app:/opt/backup-system/app
      # Optional: if entrypoint.sh also needs to be live-synced:
      - ./entrypoint.sh:/opt/backup-system/entrypoint.sh
    restart: unless-stopped