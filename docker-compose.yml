services:
  backup:
    build: .
    env_file: .env
    deploy:
      resources:
        limits:
          memory: 256M
    volumes:
      - .:/app
      - cargo-cache:/usr/local/cargo/registry
      - target-cache:/app/target
      - ${BACKUP_SOURCE_DIR:-/srv}:/srv:ro
      - ${DOWNLOAD_DIR:-./downloads}:/downloads
    stdin_open: true
    tty: true

volumes:
  cargo-cache:
  target-cache:
